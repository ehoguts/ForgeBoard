name: CodeQL

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Verify CodeQL availability
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a public repository or an explicitly enabled existing entitlement
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "public" ] && [ "$CODEQL_ENABLED" != "true" ]; then
            echo "::error::CodeQL requires a public repository or an existing GitHub Code Security entitlement. This workflow does not enable paid features."
            exit 1
          fi

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for extraction and report validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - name: Analyze source and upload results
        # GitHub explicitly permits code-scanning uploads for pull_request runs,
        # including read-only Dependabot/fork tokens. Never use pull_request_target.
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: .local/codeql-results
      - name: Block high and critical CodeQL findings
        run: python scripts/security_gate.py sarif .local/codeql-results
      - name: Retain reports from the trusted default branch
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: .local/codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: warn
