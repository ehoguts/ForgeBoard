name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://forgeboard:forgeboard_ci_only@127.0.0.1:5432/forgeboard_test
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:5173
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install test and quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Start the same patched PostgreSQL image used by Compose
        run: |
          docker build --tag forgeboard-database:ci ../infra/postgres
          docker run --detach --name forgeboard-ci-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=forgeboard --env POSTGRES_PASSWORD=forgeboard_ci_only \
            --env POSTGRES_DB=forgeboard_test \
            --health-cmd 'pg_isready -U forgeboard -d forgeboard_test' \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            forgeboard-database:ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' forgeboard-ci-db)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs forgeboard-ci-db
          exit 1
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check validation tooling style
        run: |
          python -m ruff check --config pyproject.toml ../scripts/security_gate.py ../scripts/production_smoke.py ../scripts/tests
          python -m ruff format --check --config pyproject.toml ../scripts/security_gate.py ../scripts/production_smoke.py ../scripts/tests
      - name: Check types
        run: python -m mypy app
      - name: Test with isolated SQLite
        run: python -m pytest -q
      - name: Test with PostgreSQL and real migrations
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest -q
      - name: Check PostgreSQL migration consistency
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Test components and account transitions
        run: npm test
      - name: Build application
        run: npm run build

  containers:
    name: Build ${{ matrix.service }} container
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, backend-production, frontend-production]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build locally without publishing
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            backend|frontend) docker build --pull --tag "forgeboard-${SERVICE}:ci" "$SERVICE" ;;
            backend-production) docker build --pull --file backend/Dockerfile.production --tag "forgeboard-${SERVICE}:ci" backend ;;
            frontend-production) docker build --pull --file frontend/Dockerfile.production --tag "forgeboard-${SERVICE}:ci" . ;;
            *) exit 2 ;;
          esac
